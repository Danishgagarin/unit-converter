<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>UnitConverter</title>
</head>
<body>
    <div class="container">
        <div class="input-container">
            <h2>Metric/Imperial Unit Conversion</h2>
            <input type="text" id="unitInput">
            <button id="convert-btn">Convert</button>
        </div>
        <div class="output-container">
            <div class="outDisplay-container">
                <h3>Length(Meter/Feet)</h3>
                <p id="lengthOut">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
            <div class="outDisplay-container">
                <h3>Volume(Liters/Gallons)</h3>
                <p id="volumeOut">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
            <div class="outDisplay-container">
                <h3>Mass(Kilograms/Pounds)</h3>
                <p id="massOut">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
